h1{font:400 34px/1.1 "Morgen Fraktur",serif;margin:2px 0;flex:1}
.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:5px 10px;font:inherit;font-size:14px;cursor:pointer}
.sub{color:var(--muted);font-size:14px;margin:2px 0 8px}
.sync{font-size:13px;color:var(--muted);min-height:18px}
.sync.err{color:var(--bad)}.sync.wait{color:var(--warn)}
.tabs{display:flex;gap:8px;align-items:center;margin:10px 0 14px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.hl{font:inherit;font-weight:600;color:var(--text);text-decoration:none;display:block;text-align:left;background:none;border:0;padding:0;width:100%;cursor:pointer;overflow-wrap:anywhere}
a.hl:hover,button.hl:hover{color:var(--accent)}
a.hl.seen,button.hl.seen{color:var(--muted)}
button.hl .n{font-weight:400;font-size:13px;color:var(--accent);white-space:nowrap}
.srcs{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.srcs li{padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.srcs a{color:var(--accent);text-decoration:none}.srcs .f{color:var(--muted);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px}
.tag{background:var(--chip);border-radius:6px;padding:2px 7px}.tag b{font-weight:600;color:var(--accent)}
button.tag{border:0;font:inherit;color:inherit;cursor:pointer}
button.tag:hover,button.tag.on{outline:1px solid var(--accent)}
.view{margin-left:auto;flex:none;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);cursor:pointer}
.search{position:relative;flex:0 1 230px;min-width:0}
@media (max-width:420px){.tabs{gap:6px}.tabs button{padding:6px 11px}.view{padding:6px 2px}.search{min-width:96px}.search input{padding:6px 10px}}
h3.group{display:flex;gap:8px;align-items:baseline;font-size:15px;margin:22px 0 10px}
h3.group:first-child,.filter+h3.group,.note+h3.group{margin-top:4px}
h3.group .c{font-weight:400;font-size:13px;color:var(--muted)}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:-2px 0 6px;padding:4px;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.more:hover{color:var(--accent)}
.more svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search input{width:100%;font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text)}
.search input:focus{outline:none;border-color:var(--accent)}
.drop{position:absolute;right:0;top:calc(100% + 6px);z-index:5;width:min(340px,calc(100vw - 32px));max-height:min(420px,70vh);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px 0;font-size:14px}
.drop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 12px;font:inherit;color:var(--text);cursor:pointer}
.drop button:hover{background:var(--chip)}
.drop button span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.drop .box{flex:none;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;position:relative}
.drop .box.on{background:var(--accent);border-color:var(--accent)}
.drop .box.on::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.drop .c{color:var(--muted);font-variant-numeric:tabular-nums}
.drop .none{color:var(--muted);padding:7px 12px}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:-4px 0 12px}
.filter button.plain{border-color:var(--line);background:none;color:var(--muted)}
.filter button{border:1px solid var(--accent);background:var(--chip);color:var(--text);border-radius:999px;padding:3px 10px;font:inherit;font-size:14px;cursor:pointer}
.top{display:flex;gap:8px;align-items:flex-start}
.top .hl{flex:1;min-width:0}
.votes{display:flex;gap:2px;align-items:center;margin:-6px -8px 0 0;flex:none}
.votes .score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:2px}
.votes button,.meta .save{background:none;border:0;padding:6px;color:var(--muted);opacity:.45;cursor:pointer;border-radius:8px;line-height:0}
.votes button:hover,.meta .save:hover{opacity:.9}
.votes svg,.meta .save svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.votes button.on{opacity:1}
.votes button.on.like{color:var(--good)}.votes button.on.like svg{fill:currentColor}
.votes button.on.dislike{color:var(--bad)}.votes button.on.dislike svg{fill:currentColor}
.meta .save{margin-left:auto;padding:2px 4px}
.meta .save svg{width:18px;height:18px}
.meta .save.on{opacity:1;color:var(--accent)}.meta .save.on svg{fill:currentColor}
details.also>summary{cursor:pointer;font-weight:600;margin:22px 0 10px}
.foot{color:var(--muted);font-size:13px;margin-top:20px}
.saved li{display:flex;gap:10px;align-items:flex-start}
.saved li a{flex:1}
.saved li button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:0 4px}
.empty{color:var(--muted);padding:20px 0}
.setup{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.setup label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.setup input{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.setup ol{padding-left:20px;font-size:14px}
.setup .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.setup button{font:inherit;font-size:15px;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
.setup button.plain{background:none;color:var(--text);border-color:var(--line)}
.setup+.setup{margin-top:14px}
.feeds{list-style:none;padding:0;margin:10px 0 0}
.feeds li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.feeds li div{flex:1;min-width:0}
.feeds small.why{color:var(--bad)}
.mark{flex:none;width:18px;text-align:center;font-weight:700}.mark.yes{color:var(--good)}.mark.no{color:var(--bad)}
.feeds li small{display:block;color:var(--muted);overflow-wrap:anywhere}
.setup .feeds button{background:none;color:var(--muted);border:1px solid var(--line);padding:3px 10px;font-size:13px}
.setup .feeds button.sure{color:var(--bad);border-color:var(--bad)}
.msg{font-size:14px;margin-top:10px}.msg.err{color:var(--bad)}
a{color:var(--accent)}
.read{color:var(--good);font-weight:700}
</style>
</head>
<body>
<main>
  <header>
    <h1>Morgen</h1>
    <button class="icon" id="settings" title="Token and sources">Settings</button>
  </header>
  <div class="sub" id="sub"></div>
  <div class="sync" id="sync"></div>
  <div class="tabs" id="bar" hidden>
    <button data-tab="today">Today</button>
    <button data-tab="saved">Saved</button>
    <select class="view" id="view" aria-label="View">
      <option value="default">Default</option>
      <option value="grouped">Grouped</option>
    </select>
    <div class="search">
      <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search tags">
      <div class="drop" id="drop" hidden></div>
    </div>
  </div>
  <div id="app"></div>
</main>
<script>
"use strict";

const API = "https://api.github.com";
const DEFAULT_REPO = "newhouse96/Morgen";
const LIKE = 10, DISLIKE = -10, OPEN = 5, MAX_WEIGHT = 100;
const KEEP_DAYS = 7;

// ---------- storage ----------
// localStorage can be missing or throw (private windows, some ways of opening
// a local file on Android). Fall back to memory and say so on the page.
const memory = {};
let persistent = true;
function load(key, fallback) {
  try {
    const raw = localStorage.getItem("morgen." + key);
    if (raw !== null) return JSON.parse(raw);
  } catch (e) { persistent = false; }
  return key in memory ? memory[key] : fallback;
}
function keep(key, value) {
  memory[key] = value;
  try { localStorage.setItem("morgen." + key, JSON.stringify(value)); }
  catch (e) { persistent = false; }
}
function drop(key) {
  delete memory[key];
  try { localStorage.removeItem("morgen." + key); } catch (e) { persistent = false; }
}
try {
  localStorage.setItem("morgen.probe", "1");
  persistent = localStorage.getItem("morgen.probe") === "1";
} catch (e) { persistent = false; }

let token = load("token", "");
let repo = load("repo", DEFAULT_REPO);
let feed = load("feed", null);          // last loaded feed.json, shown at once on open
let saved = load("saved", null);        // saved.json as a list, oldest first
let ui = load("ui", {});                // ui[cardId] = {like, dislike, open}: highlights
let records = load("records", {});      // records[cardId][kind] = {tag: change committed}
let tagQueue = load("tagQueue", []);    // tag changes not yet committed
let saveQueue = load("saveQueue", []);  // saves and removals not yet committed
let readDays = load("readDays", {});    // data/read.json: {day: [links read]}, shared by devices
let readQueue = load("readQueue", []);  // [{day, link}] not yet committed
let tab = "today";
let view = load("view", "default");   // "default" (ranked) or "grouped" (by tag)
const expanded = new Set();           // groups opened past their top three
const GROUP_TOP = 3;
const picked = new Set();  // tags ticked in the search list or tapped on a card; not kept across visits
let syncError = "";

// ---------- small helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const budapestDay = (d = new Date()) =>
  new Intl.DateTimeFormat("en-CA", {timeZone: "Europe/Budapest"}).format(d);
const niceDay = (day) => new Date(day + "T12:00:00Z").toLocaleDateString("en-GB",
  {weekday: "long", day: "numeric", month: "long", timeZone: "UTC"});
const clamp = (w) => Math.min(Math.max(w, 0), MAX_WEIGHT);
const fmtPoints = (p) => (Math.round(p * 10) / 10).toString();

function b64ToText(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function textToB64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

// ---------- GitHub API ----------
class GhError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}
async function gh(path, opts = {}) {
  let res;
  try {
    res = await fetch(`${API}/repos/${repo}/contents/${path}`, {
      method: opts.method || "GET",
      cache: "no-store",
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(opts.body ? {"Content-Type": "application/json"} : {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch (e) {
    throw new GhError(0, "No connection to GitHub");
  }
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).message || msg; } catch (e) {}
    throw new GhError(res.status, msg);
  }
  return opts.raw ? res.text() : res.json();
}
// A file with its sha, or {text: null, sha: null} when it does not exist yet.
async function getFile(path) {
  try {
    const f = await gh(path);
    return {text: b64ToText(f.content), sha: f.sha};
  } catch (e) {
    if (e.status === 404) return {text: null, sha: null};
    throw e;
  }
}
async function putFile(path, text, sha, message) {
  const body = {message, content: textToB64(text)};
  if (sha) body.sha = sha;
  await gh(path, {method: "PUT", body});
}
function explain(e) {
  if (e.status === 401) return "GitHub refused the token (expired or wrong). Open Settings to paste a new one.";
  if (e.status === 403) return "The token can't do this. It needs Contents: Read and write on " + repo + ".";
  if (e.status === 404) return "GitHub can't find " + repo + " with this token. Check the repository name and that the token covers it.";
  if (e.status === 0) return "No connection to GitHub.";
  return "GitHub said: " + e.message;
}

// ---------- tags.json, written the way render.py writes it ----------
function pyJson(value) {
  // json.dumps with its default separators and ensure_ascii.
  if (value === null || typeof value !== "object") {
    return JSON.stringify(value).replace(/[\u007f-￿]/g,
      (c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
  }
  if (Array.isArray(value)) return "[" + value.map(pyJson).join(", ") + "]";
  return "{" + Object.keys(value).map((k) => pyJson(k) + ": " + pyJson(value[k])).join(", ") + "}";
}
function writeTags(tags) {
  const names = Object.keys(tags).sort((a, b) => {
    const x = a.toLowerCase(), y = b.toLowerCase();
    return x < y ? -1 : x > y ? 1 : 0;
  });
  return "{\n" + names.map((n) => pyJson(n) + ": " + pyJson(tags[n])).join(",\n") + "\n}\n";
}
function tagEntry(tags, name) {
  let t = tags[name];
  if (typeof t !== "object" || t === null) t = tags[name] = {weight: Number(t) || 0, count: 0};
  t.weight = Number(t.weight) || 0;
  return t;
}
// Each op changes tags in place and returns a short label for the commit.
function applyTagOp(tags, recs, op) {
  const card = (recs[op.card] = recs[op.card] || {});
  if (op.t === "add") {
    if (card[op.kind]) return null;  // already counted
    const done = {};
    for (const name of op.tags) {
      const t = tagEntry(tags, name);
      const next = clamp(t.weight + op.delta);
      done[name] = next - t.weight;
      t.weight = next;
    }
    card[op.kind] = done;
    return op.kind;
  }
  if (op.t === "undo") {
    const done = card[op.kind];
    if (!done) return null;
    for (const [name, change] of Object.entries(done)) {
      if (name in tags) { const t = tagEntry(tags, name); t.weight = clamp(t.weight - change); }
    }
    delete card[op.kind];
    return "undo " + op.kind;
  }
  return null;
}

// ---------- committing ----------
let flushing = false, retryTimer = null;
async function flush() {
  if (flushing || !token) return;
  flushing = true;
  clearTimeout(retryTimer);
  try {
    while (tagQueue.length || saveQueue.length || readQueue.length) {
      if (tagQueue.length) await commitTags();
      if (saveQueue.length) await commitSaves();
      if (readQueue.length) await commitReads();
    }
    syncError = "";
  } catch (e) {
    syncError = explain(e);
    if (e.status !== 401 && e.status !== 403) retryTimer = setTimeout(flush, 30000);
  } finally {
    flushing = false;
    showSync();
  }
}
// GitHub answers 409 when the file changed since we read it (the render job or
// the other device committed); read it again and reapply.
async function withRetry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      if ((e.status === 409 || e.status === 422) && i < 4) continue;
      throw e;
    }
  }
}
async function commitTags() {
  const ops = tagQueue.slice();
  await withRetry(async () => {
    const file = await getFile("data/tags.json");
    const tags = file.text ? JSON.parse(file.text) : {};
    const recs = JSON.parse(JSON.stringify(records));
    const labels = ops.map((op) => applyTagOp(tags, recs, op)).filter(Boolean);
    if (labels.length) {
      await putFile("data/tags.json", writeTags(tags), file.sha, "Viewer: " + labels.join(", "));
    }
    records = recs;
  });
  tagQueue = tagQueue.slice(ops.length);
  keep("records", records);
  keep("tagQueue", tagQueue);
}
async function commitSaves() {
  const ops = saveQueue.slice();
  await withRetry(async () => {
    const file = await getFile("data/saved.json");
    let list = file.text ? JSON.parse(file.text) : [];
    if (!Array.isArray(list)) list = [];
    for (const op of ops) {
      list = list.filter((s) => !s || s.link !== op.link);
      if (op.t === "save") list.push({title: op.title, link: op.link});
    }
    await putFile("data/saved.json", JSON.stringify(list, null, 1) + "\n", file.sha,
      ops.length === 1 ? (ops[0].t === "save" ? "Viewer: save" : "Viewer: unsave") : "Viewer: saved list");
    saved = list;
  });
  saveQueue = saveQueue.slice(ops.length);
  keep("saved", saved);
  keep("saveQueue", saveQueue);
}
// Days older than KEEP_DAYS are dropped on each write.
function mergeReads(days, items) {
  const cutoff = budapestDay(new Date(Date.now() - KEEP_DAYS * 864e5));
  const out = {};
  for (const [day, links] of Object.entries(days || {})) {
    if (day >= cutoff && Array.isArray(links)) out[day] = [...links];
  }
  for (const {day, link} of items) {
    if (day < cutoff) continue;
    out[day] = out[day] || [];
    if (!out[day].includes(link)) out[day].push(link);
  }
  return out;
}
async function commitReads() {
  const ops = readQueue.slice();
  await withRetry(async () => {
    const file = await getFile("data/read.json");
    const days = mergeReads(file.text ? JSON.parse(file.text) : {}, ops);
    await putFile("data/read.json", JSON.stringify(days, null, 1) + "\n", file.sha, "Viewer: read");
    readDays = days;
  });
  readQueue = readQueue.slice(ops.length);
  keep("readDays", readDays);
  keep("readQueue", readQueue);
}
function isRead(link) {
  return Object.values(readDays).some((links) => links.includes(link)) ||
    readQueue.some((r) => r.link === link);
}
function showSync() {
  const el = $("sync");
  const waiting = tagQueue.length + saveQueue.length + readQueue.length;
  el.className = "sync" + (syncError ? " err" : waiting ? " wait" : "");
  if (syncError) {
    el.textContent = syncError + (waiting ? ` ${waiting} tap${waiting > 1 ? "s" : ""} waiting, will retry.` : "");
  } else if (waiting) {
    el.textContent = "Saving…";
  } else {
    el.textContent = "";
  }
}

// ---------- taps ----------
function stories() {
  return feed ? [...(feed.stories || []), ...(feed.also_today || [])] : [];
}
function findStory(id) { return stories().find((s) => s.id === id); }
function tagNames(story) { return story.tags.map((t) => t.tag); }
function setUi(id, key, on) {
  const u = (ui[id] = ui[id] || {});
  if (on) u[key] = true; else delete u[key];
  keep("ui", ui);
}
function vote(id, kind) {
  const story = findStory(id);
  if (!story) return;
  const u = ui[id] || {};
  const other = kind === "like" ? "dislike" : "like";
  if (u[kind]) {
    tagQueue.push({t: "undo", card: id, kind});
    setUi(id, kind, false);
  } else {
    if (u[other]) {
      tagQueue.push({t: "undo", card: id, kind: other});
      setUi(id, other, false);
    }
    tagQueue.push({t: "add", card: id, kind, tags: tagNames(story), delta: kind === "like" ? LIKE : DISLIKE});
    setUi(id, kind, true);
  }
  keep("tagQueue", tagQueue);
  refreshCard(id);
  showSync();
  flush();
}
// Mark the article read (data/read.json, so every device sees it) and count the first
// open of each card as +5.
function opened(id, link) {
  const story = findStory(id);
  if (!story) return;
  const u = ui[id] || {};
  if (link && !isRead(link)) {
    readQueue.push({day: id.slice(0, 10), link});
    keep("readQueue", readQueue);
    refreshCard(id);
  }
  if (u.open) return flush();
  tagQueue.push({t: "add", card: id, kind: "open", tags: tagNames(story), delta: OPEN});
  setUi(id, "open", true);
  keep("tagQueue", tagQueue);
  refreshCard(id);
  showSync();
  flush();
}
// What a card saves: the article, or for a group the headline and first source.
function saveTarget(story) {
  return story.sources.length === 1
    ? {title: story.sources[0].title, link: story.sources[0].link}
    : {title: story.headline, link: story.sources[0].link};
}
function isSaved(link) { return (saved || []).some((s) => s && s.link === link); }
function toggleSave(title, link) {
  const op = isSaved(link) ? {t: "unsave", link} : {t: "save", title, link};
  saved = (saved || []).filter((s) => s && s.link !== link);
  if (op.t === "save") saved.push({title, link});
  keep("saved", saved);
  saveQueue.push(op);
  keep("saveQueue", saveQueue);
  render();
  showSync();
  flush();
}

// ---------- drawing ----------
function cardHtml(s) {
  const u = ui[s.id] || {};
  const seen = u.open ? " seen" : "";
  const read = isRead;
  const tick = (on) => on ? `<span class="read" title="Read">✓</span> ` : "";
  let head, list = "";
  if (s.sources.length === 1) {
    head = `<a class="hl${seen}" href="${esc(s.sources[0].link)}" target="_blank" rel="noopener noreferrer" data-open="${esc(s.id)}">${tick(read(s.sources[0].link))}${esc(s.headline)}</a>`;
  } else {
    const items = s.sources.map((src) =>
      `<li><a href="${esc(src.link)}" target="_blank" rel="noopener noreferrer" data-open="${esc(s.id)}">${tick(read(src.link))}${esc(src.title)}</a> <span class="f">· ${esc(src.feed)}</span></li>`).join("");
    head = `<button class="hl${seen}" data-toggle aria-expanded="false">${tick(s.sources.some((src) => read(src.link)))}${esc(s.headline)} <span class="n">${s.sources.length} sources</span></button>`;
    list = `<ul class="srcs" hidden>${items}</ul>`;
  }
  const tags = s.tags.map((t) =>
    `<button class="tag${picked.has(t.tag) ? " on" : ""}" data-tag="${esc(t.tag)}" title="${picked.has(t.tag) ? "Stop filtering by" : "Filter by"} ${esc(t.tag)}">${esc(t.tag)}${t.points > 0 ? ` <b>+${fmtPoints(t.points)}</b>` : ""}</button>`).join("");
  const target = saveTarget(s);
  const feedName = s.sources.length === 1 ? `<span class="tag" style="background:none;color:var(--muted)">${esc(s.sources[0].feed)}</span>` : "";
  const saveOn = isSaved(target.link);
  const votes = `<div class="votes">
      <span class="score" title="Score">${fmtPoints(s.score)}</span>
      <button class="like${u.like ? " on" : ""}" data-vote="like" aria-pressed="${!!u.like}" title="Upvote" aria-label="Upvote"><svg viewBox="0 0 24 24"><path d="M12 4 4 13h5v7h6v-7h5z"/></svg></button>
      <button class="dislike${u.dislike ? " on" : ""}" data-vote="dislike" aria-pressed="${!!u.dislike}" title="Downvote" aria-label="Downvote"><svg viewBox="0 0 24 24"><path d="M12 20 4 11h5V4h6v7h5z"/></svg></button>
    </div>`;
  const save = `<button class="save${saveOn ? " on" : ""}" data-save aria-pressed="${saveOn}" title="${saveOn ? "Saved" : "Save"}" aria-label="${saveOn ? "Saved" : "Save"}"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-5-6 5z"/></svg></button>`;
  return `<article class="card" data-id="${esc(s.id)}">
    <div class="top">${head}${votes}</div>
    ${list}
    <div class="meta">${tags}${feedName}${save}</div>
  </article>`;
}
function refreshCard(id) {
  const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  const story = findStory(id);
  if (!el || !story) return;
  const open = el.querySelector("[data-toggle]")?.getAttribute("aria-expanded") === "true";
  el.outerHTML = cardHtml(story);
  if (open) toggleSources(document.querySelector(`.card[data-id="${CSS.escape(id)}"]`), true);
}
function toggleSources(card, force) {
  const btn = card.querySelector("[data-toggle]");
  const list = card.querySelector(".srcs");
  const open = force ?? btn.getAttribute("aria-expanded") !== "true";
  btn.setAttribute("aria-expanded", String(open));
  list.hidden = !open;
}
function drawTabs() {
  const n = (saved || []).length;
  for (const b of $("bar").querySelectorAll("[data-tab]")) b.classList.toggle("on", b.dataset.tab === tab);
  $("bar").querySelector('[data-tab="saved"]').textContent = "Saved" + (n ? ` (${n})` : "");
}

// ---------- tag filter ----------
// Lower case without accents, so "kozgazdasag" finds "#Kozgazdasag" and "kozg" finds both.
function fold(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
// A card shows when it has every ticked tag.
function matches(s) { const names = tagNames(s); return [...picked].every((t) => names.includes(t)); }
// Tags on the cards still showing, most used first, so every tag offered narrows
// the feed further. Ticked tags stay listed so they can be unticked.
function tagCounts() {
  const counts = {};
  for (const t of picked) counts[t] = 0;
  for (const s of stories().filter(matches)) for (const t of tagNames(s)) counts[t] = (counts[t] || 0) + 1;
  return Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function drawDrop() {
  const q = fold($("q").value.trim()).replace(/^#/, "");
  const tags = tagCounts().filter(([t]) => !q || fold(t).includes(q));
  const y = $("drop").hidden ? 0 : $("drop").scrollTop;
  $("drop").innerHTML = tags.length
    ? tags.map(([t, n]) => `<button data-pick="${esc(t)}" role="checkbox" aria-checked="${picked.has(t)}"><span class="box${picked.has(t) ? " on" : ""}"></span><span>${esc(t)}</span><span class="c">${n}</span></button>`).join("")
    : `<div class="none">${feed ? "No matching tags" : "Loading the feed…"}</div>`;
  $("drop").hidden = false;
  $("drop").scrollTop = y;
}
function closeDrop() { $("drop").hidden = true; $("q").value = ""; }
function toggleTag(t) {
  if (picked.has(t)) picked.delete(t); else picked.add(t);
  tab = "today";
  render();
}
function clearTags() {
  picked.clear();
  render();
}
// Grouped view: each card goes under its tag that the most cards share (ticked
// tags aside, since every card has them). Groups are ordered by the sum of
// their cards' scores, so both weight and size count. Cards left
// alone in their group go under Other. A group shows its three highest scoring
// cards until its arrow is tapped.
function groupedHtml(cards) {
  const counts = {};
  for (const s of cards) for (const t of tagNames(s)) if (!picked.has(t)) counts[t] = (counts[t] || 0) + 1;
  const groups = new Map();
  for (const s of cards) {
    let best = "";
    for (const t of tagNames(s)) if (!picked.has(t) && (!best || counts[t] > counts[best])) best = t;
    if (!groups.has(best)) groups.set(best, []);
    groups.get(best).push(s);
  }
  const other = [];
  const list = [];
  for (const [t, group] of groups) {
    if (t && group.length > 1) list.push([t, group]); else other.push(...group);
  }
  const total = (group) => group.reduce((sum, s) => sum + (s.score || 0), 0);
  list.sort((a, b) => total(b[1]) - total(a[1]) || b[1].length - a[1].length || a[0].localeCompare(b[0]));
  if (other.length) list.push(["Other", other]);
  return list.map(([t, group]) => {
    group = [...group].sort((a, b) => b.score - a.score);
    const open = expanded.has(t);
    const shown = open ? group : group.slice(0, GROUP_TOP);
    const more = group.length > GROUP_TOP
      ? `<button class="more" data-expand="${esc(t)}" aria-expanded="${open}">${open ? "Show fewer" : `Show all ${group.length}`}
          <svg viewBox="0 0 24 24"><path d="${open ? "M6 15l6-6 6 6" : "M6 9l6 6 6-6"}"/></svg></button>`
      : "";
    return `<h3 class="group">${esc(t)} <span class="c">${group.length}</span></h3>${shown.map(cardHtml).join("")}${more}`;
  }).join("");
}
function todayHtml() {
  if (!feed) return `<div class="empty">Loading the feed…</div>`;
  const notes = [];
  if (feed.date !== budapestDay()) {
    notes.push(`This is the feed from ${esc(niceDay(feed.date))}. Today's isn't ready yet.`);
  }
  if (feed.tagged === false) {
    notes.push("Claude hadn't tagged today's articles when this feed was built, so they are untagged and in arrival order.");
  }
  if (!persistent) {
    notes.push("This browser isn't keeping data for this page, so the token and the tap highlights are lost when it closes.");
  }
  const filtering = picked.size > 0;
  const main = (feed.stories || []).filter(matches), also = (feed.also_today || []).filter(matches);
  let html = notes.map((n) => `<div class="note">${n}</div>`).join("");
  if (filtering) {
    const n = main.length + also.length;
    const chips = [...picked].map((t) => `<button data-tag="${esc(t)}" title="Remove ${esc(t)}">${esc(t)} ✕</button>`).join("");
    const all = picked.size > 1 ? `<button data-clear class="plain">Clear all</button>` : "";
    html += `<div class="filter">${n} card${n === 1 ? "" : "s"} with ${chips}${all}</div>`;
    if (!n) return html + `<div class="empty">Nothing today matches.</div>`;
  }
  if (view === "grouped") html += groupedHtml([...main, ...also]);
  else if (main.length) html += main.map(cardHtml).join("");
  else if (!filtering) html += `<div class="empty">Nothing ranked yet. Everything is under Also today.</div>`;
  if (also.length && view !== "grouped") {
    const openAttr = main.length && !filtering ? "" : " open";
    html += `<details class="also"${openAttr}><summary>Also today (${also.length})</summary>${also.map(cardHtml).join("")}</details>`;
  }
  const failed = (feed.failed || []).map((f) => f.name || f.url).filter(Boolean);
  if (failed.length) html += `<p class="foot">Failed this morning: ${failed.map(esc).join(", ")}.</p>`;
  return html;
}
function savedHtml() {
  const seenLinks = new Set();
  const list = [];
  for (const s of [...(saved || [])].reverse()) {
    if (s && s.link && !seenLinks.has(s.link)) { seenLinks.add(s.link); list.push(s); }
  }
  if (!list.length) return `<div class="empty">Nothing saved. The Save button on a card puts it here.</div>`;
  return `<div class="card"><ul class="srcs saved" style="margin:0">${list.map((s) =>
    `<li><a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">${esc(s.title || s.link)}</a>
      <button data-unsave="${esc(s.link)}" title="Remove" aria-label="Remove">✕</button></li>`).join("")}</ul></div>`;
}
function render() {
  if (!token) return setupView();
  setHeader(false);
  const alsoOpen = document.querySelector("details.also")?.open;
  const y = window.scrollY;
  $("sub").textContent = feed ? niceDay(feed.date) : "";
  drawTabs();
  $("app").innerHTML = tab === "today" ? todayHtml() : savedHtml();
  if (!$("drop").hidden) drawDrop();
  if (alsoOpen) { const d = document.querySelector("details.also"); if (d) d.open = true; }
  window.scrollTo(0, y);
}

// ---------- setup ----------
let inSettings = false;
// The header button reads "Settings" on the feed and "Feed" in settings.
function setHeader(settings) {
  inSettings = settings;
  $("settings").textContent = settings ? "Feed" : "Settings";
  $("settings").hidden = !token;
  $("bar").hidden = settings || !token;
  if (settings) closeDrop();
}
function setupView(message) {
  setHeader(true);
  $("sub").textContent = "";
  const tokenForm = `<form class="setup" id="setup" autocomplete="off">
    <strong>${token ? "GitHub connection" : "Connect this device to GitHub"}</strong>
    <ol>
      <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub › New fine-grained token</a>.</li>
      <li>Repository access: <em>Only select repositories</em> › Morgen. Permissions › Repository › <em>Contents: Read and write</em>. Expiration: 1 year.</li>
      <li>Generate it and paste it below. It stays in this browser only.</li>
    </ol>
    <label for="tok">Token</label>
    <input id="tok" type="password" placeholder="github_pat_…" value="${esc(token)}" spellcheck="false">
    <label for="rep">Repository</label>
    <input id="rep" value="${esc(repo)}" spellcheck="false">
    <div class="row">
      <button type="submit">Connect</button>
      ${token ? `<button type="button" class="plain" id="cancel">Cancel</button>
      <button type="button" class="plain" id="forget">Forget token</button>` : ""}
    </div>
    <div class="msg${message ? " err" : ""}" id="msg">${message ? esc(message) : ""}</div>
    ${persistent ? "" : `<div class="msg err">This browser won't keep the token after the page closes.</div>`}
  </form>`;
  const feedForm = `<form class="setup" id="feedform" autocomplete="off">
    <strong>Sources</strong>
    <ul class="feeds" id="feedlist"><li><div>Loading…</div></li></ul>
    <label for="fname">Add a feed: name</label>
    <input id="fname" placeholder="Shown on cards, e.g. Telex">
    <label for="furl">RSS or news sitemap address</label>
    <input id="furl" type="url" placeholder="https://…" spellcheck="false">
    <div class="row"><button type="submit">Add feed</button></div>
    <div class="msg" id="fmsg"></div>
  </form>`;
  $("app").innerHTML = token ? feedForm + tokenForm : tokenForm;
  $("setup").onsubmit = async (ev) => {
    ev.preventDefault();
    const t = $("tok").value.trim(), r = $("rep").value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\/+$/, "");
    if (!t || !/^[\w.-]+\/[\w.-]+$/.test(r)) { $("msg").textContent = "Paste the token and give the repository as owner/name."; return; }
    const oldToken = token, oldRepo = repo;
    token = t; repo = r;
    $("msg").className = "msg"; $("msg").textContent = "Checking…";
    try {
      await gh("data/feed.json", {raw: true});
    } catch (e) {
      $("msg").className = "msg err"; $("msg").textContent = explain(e);
      token = oldToken; repo = oldRepo;
      return;
    }
    keep("token", token); keep("repo", repo);
    syncError = "";
    render();
    refresh();
    flush();
  };
  if (token) {
    loadFeeds();
    $("feedform").onsubmit = (ev) => { ev.preventDefault(); addFeed(); };
    $("cancel").onclick = () => render();
    $("forget").onclick = () => { token = ""; drop("token"); setupView(); };
  }
}

// ---------- sources (data/feeds.json) ----------
let feeds = null;
function writeFeeds(list) {
  return list.length ? "[\n" + list.map((f) => " " + pyJson(f)).join(",\n") + "\n]\n" : "[]\n";
}
// ✓ when the feed has articles in the edition on screen; ✗ with the reason
// when it hasn't.
function feedStatus(f) {
  const count = stories().reduce((n, s) => n + s.sources.filter((src) => src.feed === f.name).length, 0);
  if (count) return {ok: true, why: `${count} article${count > 1 ? "s" : ""} in this edition`};
  if (!feed) return {ok: false, why: "No edition loaded"};
  const failed = (feed.failed || []).find((x) => x.url === f.url);
  if (failed) return {ok: false, why: "Couldn't be read: " + (failed.error || "unknown error")};
  const added = (load("feedAdded", {}))[f.url];
  const tried = feed.feeds ? feed.feeds.includes(f.url) : !(added && added > feed.rendered_at);
  if (!tried) return {ok: false, why: "Added after this morning's scrape; first read tomorrow"};
  return {ok: false, why: "Inactive: no new articles since the last scrape"};
}
function drawFeeds() {
  const el = $("feedlist");
  if (!el) return;
  el.innerHTML = !feeds ? "<li><div>Couldn't load the feed list.</div></li>"
    : !feeds.length ? "<li><div>No feeds yet.</div></li>"
    : feeds.map((f, i) => {
      const st = feedStatus(f);
      return `<li><span class="mark ${st.ok ? "yes" : "no"}" title="${esc(st.why)}">${st.ok ? "✓" : "✗"}</span>
        <div>${esc(f.name)}${st.ok ? "" : `<small class="why">${esc(st.why)}</small>`}<small>${esc(f.url)}</small></div>
        <button type="button" data-remove-feed="${i}">Remove</button></li>`;
    }).join("");
}
async function loadFeeds() {
  try {
    const file = await getFile("data/feeds.json");
    feeds = file.text ? JSON.parse(file.text) : [];
  } catch (e) {
    feeds = null;
    $("fmsg").className = "msg err"; $("fmsg").textContent = explain(e);
  }
  drawFeeds();
}
// Read the file fresh, change it, write it back; retried on a conflict.
async function changeFeeds(change, message) {
  await withRetry(async () => {
    const file = await getFile("data/feeds.json");
    const list = change(file.text ? JSON.parse(file.text) : []);
    await putFile("data/feeds.json", writeFeeds(list), file.sha, message);
    feeds = list;
  });
  drawFeeds();
}
async function addFeed() {
  const name = $("fname").value.trim(), url = $("furl").value.trim();
  const msg = $("fmsg");
  msg.className = "msg err";
  if (!name || !/^https?:\/\/\S+$/.test(url)) { msg.textContent = "Give the feed a name and a full address starting with https://."; return; }
  if ((feeds || []).some((f) => f.url === url)) { msg.textContent = "That feed is already in the list."; return; }
  msg.className = "msg"; msg.textContent = "Adding…";
  try {
    keep("feedAdded", {...load("feedAdded", {}), [url]: new Date().toISOString()});
    await changeFeeds((list) => list.some((f) => f.url === url) ? list : [...list, {name, url}], "Viewer: add feed " + name);
    $("fname").value = ""; $("furl").value = "";
    msg.textContent = `Added ${name}.`;
  } catch (e) {
    msg.className = "msg err"; msg.textContent = explain(e);
  }
}
async function removeFeed(btn) {
  // First tap asks, second tap removes.
  if (!btn.classList.contains("sure")) { btn.classList.add("sure"); btn.textContent = "Tap to remove"; return; }
  const f = feeds[Number(btn.dataset.removeFeed)];
  const msg = $("fmsg");
  msg.className = "msg"; msg.textContent = "Removing…";
  try {
    await changeFeeds((list) => list.filter((x) => x.url !== f.url), "Viewer: remove feed " + f.name);
    msg.textContent = `Removed ${f.name}.`;
  } catch (e) {
    msg.className = "msg err"; msg.textContent = explain(e);
  }
}

// ---------- loading ----------
let lastLoad = 0;
async function refresh() {
  if (!token) return;
  lastLoad = Date.now();
  try {
    const [feedText, savedFile, readFile] = await Promise.all(
      [gh("data/feed.json", {raw: true}), getFile("data/saved.json"), getFile("data/read.json")]);
    readDays = mergeReads(readFile.text ? JSON.parse(readFile.text) : {}, []);
    keep("readDays", readDays);
    feed = JSON.parse(feedText);
    keep("feed", feed);
    // Pending saves aren't in the file yet; keep them on top of what it says.
    if (!saveQueue.length) {
      saved = savedFile.text ? JSON.parse(savedFile.text) : [];
      keep("saved", saved);
    }
    prune();
    if (!flushing && !(tagQueue.length + saveQueue.length + readQueue.length)) syncError = "";
  } catch (e) {
    syncError = (feed ? "Couldn't load the latest feed. " : "") + explain(e);
    if (e.status === 401) { showSync(); return setupView(explain(e)); }
  }
  if (saved === null) saved = (feed && feed.saved ? [...feed.saved].reverse() : []);
  render();
  showSync();
}
// Highlights and undo records only matter for recent cards.
function prune() {
  const cutoff = budapestDay(new Date(Date.now() - KEEP_DAYS * 864e5));
  const pending = new Set(tagQueue.map((op) => op.card));
  for (const map of [ui, records]) {
    for (const id of Object.keys(map)) {
      if (id.slice(0, 10) < cutoff && !pending.has(id)) delete map[id];
    }
  }
  keep("ui", ui);
  keep("records", records);
}

// ---------- events ----------
document.addEventListener("click", (ev) => {
  if (!ev.target.closest(".search")) closeDrop();
  const el = ev.target.closest("a,button");
  if (!el) return;
  if (el.dataset.tag) return toggleTag(el.dataset.tag);
  if (el.dataset.pick) return toggleTag(el.dataset.pick);
  if (el.hasAttribute("data-clear")) return clearTags();
  if (el.dataset.expand) {
    const t = el.dataset.expand;
    if (expanded.has(t)) expanded.delete(t); else expanded.add(t);
    render();
    // Folding a long group back up: bring its heading back into view.
    if (!expanded.has(t)) {
      const h = [...document.querySelectorAll("h3.group")].find((x) => x.firstChild.textContent.trim() === t);
      if (h && h.getBoundingClientRect().top < 0) h.scrollIntoView({block: "start"});
    }
    return;
  }
  const card = el.closest(".card");
  const id = card?.dataset.id;
  if (el.dataset.removeFeed) return removeFeed(el);
  if (el.dataset.open) return opened(el.dataset.open, el.getAttribute("href"));
  if (el.dataset.tab) { tab = el.dataset.tab; render(); return; }
  if (el.hasAttribute("data-toggle")) return toggleSources(card);
  if (el.dataset.vote && id) return vote(id, el.dataset.vote);
  if (el.hasAttribute("data-save") && id) {
    const story = findStory(id);
    if (story) { const s = saveTarget(story); toggleSave(s.title, s.link); }
    return;
  }
  if (el.dataset.unsave) {
    const item = (saved || []).find((s) => s && s.link === el.dataset.unsave);
    if (item) toggleSave(item.title, item.link);
  }
});
// Middle click opens a link in a new tab without a click event.
document.addEventListener("auxclick", (ev) => {
  const a = ev.target.closest("a[data-open]");
  if (a && ev.button === 1) opened(a.dataset.open, a.getAttribute("href"));
});
$("settings").onclick = () => (inSettings ? render() : setupView());
$("q").addEventListener("focus", drawDrop);
$("q").addEventListener("input", drawDrop);
$("view").value = view;
$("view").addEventListener("change", () => {
  view = $("view").value;
  keep("view", view);
  tab = "today";
  render();
  window.scrollTo(0, 0);
});
$("q").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" || ev.key === "Escape") { closeDrop(); $("q").blur(); }
});
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !token) return;
  flush();
  if (Date.now() - lastLoad > 15 * 60 * 1000) refresh();
});

render();
showSync();
if (token) { refresh(); flush(); }
</script>
</body>
</html>
